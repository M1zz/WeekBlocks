name: WeekBlocks
options:
  bundleIdPrefix: com.devkoan
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: "2.5.0"
settings:
  base:
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
# ⚠️ 스킴을 여기 적어둔다. xcodegen이 프로젝트를 다시 만들 때 xcshareddata를 지우므로,
# 명시해두지 않으면 재생성할 때마다 Xcode·xcodebuild가 스킴을 못 찾는다.
schemes:
  WeekBlocks:
    build:
      targets:
        WeekBlocks: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  WeekBlocks:
    type: application
    platform: macOS
    sources:
      - path: WeekBlocks
    dependencies:
      - package: LeeoKit
      - target: TodoShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devkoan.ScheduleDensityApp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WeekBlocks/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "무지개 공방"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: WeekBlocks/WeekBlocks.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # 사파리 등의 공유 메뉴에서 '무지개 공방'을 고르면 뜨는 작은 창.
  # SwiftData store는 앱 샌드박스 안이라 못 여니, App Group의 '받은 상자'에만 적어둔다
  # (앱이 켜질 때 가져간다 → TodoShareInbox.swift).
  # ⚠️ iOS '욕망의 무지개'의 TodoShareExtension과 짝이다. 같이 고칠 것.
  TodoShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TodoShare
      # 앱과 함께 쓰는 파일만 골라 넣는다.
      - path: WeekBlocks/TodoShareInbox.swift
      - path: WeekBlocks/TodoLabelChip.swift
      # TodoLabel 정의. 모델에 얹힌 확장은 BacklogItem+Label.swift로 떼어냈으므로
      # 이 파일만으로 충분하다 (SwiftData 모델이 따라오지 않는다).
      - path: WeekBlocks/TodoSplitAdvisor.swift
      # formatDuration, Date.currentWeekStart
      - path: WeekBlocks/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devkoan.ScheduleDensityApp.TodoShare
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodoShare/TodoShare.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
