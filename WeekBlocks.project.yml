name: WeekBlocks
options:
  bundleIdPrefix: com.devkoan
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# 빌드에 안 들어가지만 Xcode 파일 목록에서는 보여야 하는 것.
# 스킴이 경로로만 가리키므로 여기 적어두지 않으면 네비게이터에서 열 길이 없다.
fileGroups:
  - WeekBlocks.storekit

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    from: "3.5.1"
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    # ⚠️ 빌드 번호는 **한 번 올린 것보다 항상 커야 한다.** 스토어에 9까지 올라가 있어서
    #    1로 되돌렸다가 업로드가 거절됐다("must contain a higher version than [9]").
    #    마케팅 버전(1.1.0)과 달리 이 값은 되돌리거나 다시 쓰지 못한다. 올리기만 한다.
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
# ⚠️ 스킴을 여기 적어둔다. xcodegen이 프로젝트를 다시 만들 때 xcshareddata를 지우므로,
# 명시해두지 않으면 재생성할 때마다 Xcode·xcodebuild가 스킴을 못 찾는다.
schemes:
  WeekBlocks:
    build:
      targets:
        WeekBlocks: all
    run:
      config: Debug
      # 로컬에서 구매 흐름을 굴려보는 가짜 스토어 (→ WeekBlocks.storekit).
      # App Store Connect에 상품이 승인되기 전에는 이것 없이 페이월을 못 열어본다 —
      # Product.products()가 빈 배열을 주고 '열기' 버튼이 영영 꺼져 있다.
      # ⚠️ 이 파일의 productID는 콘솔에 만들 상품과 **글자 하나까지 같아야** 의미가 있다.
      # ⚠️ Release/archive에는 안 붙는다. 실제 출시 빌드는 언제나 진짜 App Store를 본다.
      storeKitConfiguration: WeekBlocks.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  WeekBlocks:
    type: application
    platform: macOS
    sources:
      - path: WeekBlocks
    dependencies:
      - package: LeeoKit
      - target: TodoShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devkoan.ScheduleDensityApp
        # ⚠️ 번들 이름이 곧 사람이 찾는 이름이다.
        #    스포트라이트의 앱 검색은 파일명(`무지개 공방.app`)과 CFBundleName으로 잡는다.
        #    CFBundleDisplayName만 한글로 두면 독과 파인더에만 '무지개 공방'으로 보이고,
        #    정작 스포트라이트에서는 'WeekBlocks'로만 찾아진다. 그래서 PRODUCT_NAME을 바꾼다.
        PRODUCT_NAME: "무지개 공방"
        # 번들 이름과 달리 **실행 파일·모듈 이름은 ASCII로 못박는다.**
        # PRODUCT_NAME을 따라가게 두면 바이너리가 '무지개 공방', 스위프트 모듈이
        # '무지개_공방'이 되어 크래시 리포트·ps·로그 필터가 전부 읽기 어려워진다.
        EXECUTABLE_NAME: WeekBlocks
        PRODUCT_MODULE_NAME: WeekBlocks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WeekBlocks/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "무지개 공방"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: WeekBlocks/WeekBlocks.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # 사파리 등의 공유 메뉴에서 '무지개 공방'을 고르면 뜨는 작은 창.
  # SwiftData store는 앱 샌드박스 안이라 못 여니, App Group의 '받은 상자'에만 적어둔다
  # (앱이 켜질 때 가져간다 → TodoShareInbox.swift).
  # ⚠️ iOS '욕망의 무지개'의 TodoShareExtension과 짝이다. 같이 고칠 것.
  TodoShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TodoShare
      # 앱과 함께 쓰는 파일만 골라 넣는다.
      - path: WeekBlocks/TodoShareInbox.swift
      # TodoLabel 정의. 모델에 얹힌 확장은 BacklogItem+Label.swift로 떼어냈으므로
      # 이 파일만으로 충분하다 (SwiftData 모델이 따라오지 않는다).
      - path: WeekBlocks/TodoSplitAdvisor.swift
      # formatDuration, Date.currentWeekStart
      - path: WeekBlocks/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devkoan.ScheduleDensityApp.TodoShare
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodoShare/TodoShare.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
